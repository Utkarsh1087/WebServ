<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebServ - Page Not Found</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-code {
            font-size: 7rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ef4444 0%, #b91c1c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
            line-height: 1;
        }
        .btn-home {
            display: inline-block;
            margin-top: 1.5rem;
            padding: 0.75rem 1.5rem;
            background: var(--accent);
            color: white;
            text-decoration: none;
            border-radius: 50px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px var(--accent-glow);
        }
        .btn-home:hover {
            transform: scale(1.05);
            background: #4f46e5;
            box-shadow: 0 6px 20px var(--accent-glow);
        }
    </style>
</head>
<body>
    <div class="background-glow glow-1" style="background: radial-gradient(circle, rgba(239, 68, 68, 0.15) 0%, transparent 70%);"></div>
    
    <main class="container" style="text-align: center; max-width: 500px;">
        <div class="status-card">
            <div class="error-code">404</div>
            <h2>Resource Not Found</h2>
            <p style="color: var(--text-secondary); margin-top: 1rem; line-height: 1.6;">
                The file or endpoint you requested is not served by this WebServ instance. Please check the URL and try again.
            </p>
            <a href="index.html" class="btn-home">Return Home</a>
        </div>
        <footer>
            <p>WebServ C++ Server</p>
        </footer>
    </main>
</body>
</html>
