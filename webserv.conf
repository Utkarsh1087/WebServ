# WebServ Configuration File
# Comments are prefixed with '#'

server {
    # The port number the server will listen on
    port = 8080

    # The directory containing static files to serve
    root = "./public"

    # The default index file to load when a directory is requested
    index = "index.html"

    # Maximum request body size allowed (in bytes)
    # Default is 10,485,760 bytes (10MB)
    max_body_size = 10485760
}
